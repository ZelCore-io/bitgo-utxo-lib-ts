name: Publish to npm

# Publishes @runonflux/bitgo-utxo-lib from CI with npm trusted publishing
# (OIDC) and a signed provenance attestation, so consumers can check that a
# given npm version was built from this repository at a given tag
# (`npm audit signatures`). There is no long-lived npm token anywhere: npm
# exchanges this job's short-lived GitHub OIDC token for a publish credential,
# and only for the repo + workflow file + environment configured as the
# package's trusted publisher on npmjs.com.
#
# Release: bump package.json "version", merge to master, then push tag vX.Y.Z.
on:
  push:
    tags: ['v*']

# Nothing by default; the job below asks for exactly what it needs.
permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: verify, test, build, publish (provenance)
    runs-on: ubuntu-latest
    # Required reviewers + "selected tags: v*" are configured on this
    # environment in the repo settings; the npm trusted publisher is bound to it.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      # Third-party actions are pinned to full commit SHAs (tags can be moved).
      # No dependency caches in this job: a release must not restore state
      # written by other workflow runs (cache poisoning).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No registry-url: npm gets its publish token from OIDC (trusted
          # publishing), and the .npmrc setup-node would write holds an unset
          # ${NODE_AUTH_TOKEN} that yarn v1 refuses to load.

      # Trusted publishing needs npm >= 11.5.1. Pinned exactly.
      - name: Pin npm
        run: npm install -g --ignore-scripts npm@11.19.1 && npm --version

      - name: Tag must equal package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi

      # Lifecycle scripts of dependencies never run on the release runner.
      - run: yarn install --frozen-lockfile --ignore-scripts
      # No `yarn audit`: it fails on the current tree (1 low advisory in
      # elliptic as of 9.39.3). Add it once clean.
      # No `yarn lint`: eslint is not a devDependency and .eslintrc.json extends
      # ../../.eslintrc.json from the upstream BitGo monorepo, so it cannot run here.

      # `prepare` (which builds) does not run under --ignore-scripts, so
      # dist/src, which is what the tarball ships, is built here explicitly.
      # tsc --build also type-checks src/ and test/.
      - run: yarn build

      # Full unit suite (mocha --recursive), deliberately with no exclusions.
      # `yarn test` is not used: its mocha run is not recursive, so it covers
      # only the top-level spec files (5,915 of 8,355 tests) and cannot meet its
      # own nyc coverage thresholds (34% lines vs 88%).
      # IT DOES NOT PASS ON THE CURRENT TREE: 670 tests fail as of 9.39.3, the
      # same on Node 22 and 24 (576 `networks` checks, 542 of them "has distinct
      # properties" pairs, involving the altcoin networks this fork added; 54
      # third-party parse fixtures ("<coin> not supported"); 28 Address suites
      # whose fixture files for those coins are missing; 11 regtest fixture
      # checks for zcashTest v450 / fluxtestnet v455 and the default version;
      # 1 output-script check). Some cover network parameters and transaction
      # parsing, so they are not skipped: publishing stays blocked
      # until they are fixed or each expectation is corrected after review.
      # Do not add exclusions to get a release out.
      - name: Unit tests (full suite; blocks publishing while any test fails)
        env:
          # Node 24 strips TypeScript types itself before ts-node/register sees
          # the file, and cannot parse `import x = require()`: mocha aborts
          # before running a single test. Leave .ts loading to ts-node.
          NODE_OPTIONS: --no-experimental-strip-types
        run: yarn unit-test

      # --ignore-scripts: publish exactly the tarball of what was built and
      # tested above (prepare would only rebuild it).
      - name: Stage publish with provenance (maintainer approves on npm)
        # Staged publishing: CI uploads the version (with provenance) but it is
        # NOT live until a maintainer approves it with 2FA on npmjs.com or via
        # `npm stage approve <stage-id>`. The npm trusted publisher is configured
        # without 'Allow npm publish', so a direct `npm publish` would be refused.
        run: npm stage publish --provenance --access public --ignore-scripts
